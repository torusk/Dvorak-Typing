<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dvorak Typing — Minimalist & Effective</title>

    <!-- Open Graph / Discord / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dvorak Typing Trainer" />
    <meta property="og:title" content="Dvorak Typing — Minimalist & Effective" />
    <meta property="og:description"
  content="Faster, more comfortable, and more accurate than QWERTY. Master the Dvorak layout with this sleek, distraction-free web trainer. Download printable PDF keymaps and practice using your own custom text files." />
    <meta property="og:url" content="https://dvorak-typing.vercel.app/" />
    <meta property="og:image" content="https://dvorak-typing.vercel.app/og-image-dv.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dvorak Typing — Minimalist & Effective" />
    <meta name="twitter:description"
  content="Faster, more comfortable, and more accurate than QWERTY. Master the Dvorak layout with this sleek, distraction-free web trainer. Download printable PDF keymaps and practice using your own custom text files." />
    <meta name="twitter:image" content="https://dvorak-typing.vercel.app/og-image-dv.png" />

    <link rel="stylesheet" href="style.css" />
    <!-- Favicon / App Icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="icon/icon_16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon/icon_32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="icon/icon_48x48.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="icon/icon_128x128.png" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="title">Dvorak Typing</h1>
      <div class="controls">
        <div class="controls-stack">
          <button id="dlBtn" class="btn" type="button" title="Download Dvorak layout A4 PDF">
            Dvorak PDF
          </button>
          <div class="file-picker">
            <input id="filePicker" type="file" accept=".txt" />
            <button id="pickBtn" class="btn" type="button">Load Texts</button>
          </div>
        </div>
      </div>
    </header>

    <main class="game" aria-live="polite">
      <section id="text" class="text" aria-label="Target text"></section>
      <footer class="keyboard-wrapper" aria-label="Dvorak Keyboard">
        <div id="keyboard" class="keyboard"></div>
      </footer>
    </main>

    <noscript>This app requires JavaScript to function properly.</noscript>
    <script src="main.js" defer></script>
  </body>
</html>
